name: Diagnose H3 Video History

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Read H3 usage identifiers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key "$SERVER_USER@$SERVER_HOST" \
            'docker exec ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "SELECT id, request_id, actual_cost, created_at FROM usage_logs WHERE model = '\''MiniMax-H3'\'' ORDER BY created_at; SELECT '\''mapping_count'\'', COUNT(*), 0, NOW() FROM usage_video_tasks;"'\'''
