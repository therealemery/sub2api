name: Backfill H3 Video History

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Backfill owner-scoped video mappings
        env:
          H3_VIDEO_TASK_IDS: ${{ secrets.H3_VIDEO_TASK_IDS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          printf '%s\n' "$H3_VIDEO_TASK_IDS" | ssh \
            -o StrictHostKeyChecking=no \
            -i /tmp/ssh_key \
            "$SERVER_USER@$SERVER_HOST" \
            'set -euo pipefail
             cd /opt/ownapi/deploy
             inserted=0
             matched=0
             while IFS= read -r task_id; do
               [ -n "$task_id" ] || continue
               request_id="$(printf "ownapi-video-usage:%s" "$task_id" | sha256sum | cut -d" " -f1)"
               result="$(docker exec ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|"'\'' \
                 -v request_id="$request_id" -v task_id="$task_id" \
                 -c "WITH matched AS (SELECT id, user_id FROM usage_logs WHERE model = '\''MiniMax-H3'\'' AND request_id = :'\''request_id'\''), inserted AS (INSERT INTO usage_video_tasks (usage_log_id, user_id, task_id) SELECT id, user_id, :'\''task_id'\'' FROM matched ON CONFLICT (usage_log_id) DO NOTHING RETURNING 1) SELECT (SELECT COUNT(*) FROM matched), (SELECT COUNT(*) FROM inserted);")"
               task_matched="${result%%|*}"
               task_inserted="${result##*|}"
               [ "$task_matched" = "1" ] || { echo "Expected exactly one matching usage row" >&2; exit 1; }
               matched=$((matched + task_matched))
               inserted=$((inserted + task_inserted))
             done
             [ "$matched" -eq 3 ] || { echo "Expected three historical task matches" >&2; exit 1; }
             total="$(docker exec ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "SELECT COUNT(*) FROM usage_video_tasks vt JOIN usage_logs ul ON ul.id = vt.usage_log_id WHERE ul.model = '\''MiniMax-H3'\'';"'\'')"
             echo "Historical task matches: $matched; inserted now: $inserted; total H3 mappings: $total"'
