name: Backfill H3 Video History

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Backfill verified owner-scoped mappings
        env:
          H3_VIDEO_TASK_IDS: ${{ secrets.H3_VIDEO_TASK_IDS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mapfile -t tasks < <(printf '%s\n' "$H3_VIDEO_TASK_IDS" | sed '/^$/d')
          [ "${#tasks[@]}" -eq 3 ] || { echo "Expected exactly three recovered tasks" >&2; exit 1; }

          payload=""
          for task_id in "${tasks[@]}"; do
            request_id="$(printf 'ownapi-video-usage:%s' "$task_id" | sha256sum | cut -d' ' -f1)"
            task_b64="$(printf '%s' "$task_id" | base64 -w0)"
            payload+="${request_id}|${task_b64}"$'\n'
          done

          printf '%s' "$payload" | ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key "$SERVER_USER@$SERVER_HOST" \
            'set -euo pipefail
             count=0
             while IFS="|" read -r request_id task_b64; do
               [ -n "$request_id" ] || continue
               task_id="$(printf "%s" "$task_b64" | base64 -d)"
               result="$(docker exec ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|"'\'' \
                 -c "WITH matched AS (SELECT id, user_id FROM usage_logs WHERE model = '\''MiniMax-H3'\'' AND request_id = '\''${request_id}'\''), inserted AS (INSERT INTO usage_video_tasks (usage_log_id, user_id, task_id) SELECT id, user_id, '\''${task_id}'\'' FROM matched ON CONFLICT (usage_log_id) DO NOTHING RETURNING 1) SELECT (SELECT COUNT(*) FROM matched), (SELECT COUNT(*) FROM inserted);")"
               [ "${result%%|*}" = "1" ] || { echo "Expected one verified H3 usage match" >&2; exit 1; }
               count=$((count + 1))
             done
             [ "$count" -eq 3 ] || { echo "Expected three payload rows" >&2; exit 1; }
             total="$(docker exec ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "SELECT COUNT(*) FROM usage_video_tasks vt JOIN usage_logs ul ON ul.id = vt.usage_log_id WHERE ul.model = '\''MiniMax-H3'\'';"'\'')"
             [ "$total" -ge 3 ] || { echo "H3 mapping verification failed" >&2; exit 1; }
             echo "Verified H3 mappings: $total"'
