name: Backfill H3 Video History

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Backfill verified owner-scoped mappings
        env:
          H3_VIDEO_TASK_IDS: ${{ secrets.H3_VIDEO_TASK_IDS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mapfile -t tasks < <(printf '%s\n' "$H3_VIDEO_TASK_IDS" | sed '/^$/d')
          [ "${#tasks[@]}" -eq 3 ] || { echo "Expected exactly three recovered tasks" >&2; exit 1; }

          sql=""
          for task_id in "${tasks[@]}"; do
            request_id="$(printf 'ownapi-video-usage:%s' "$task_id" | sha256sum | cut -d' ' -f1)"
            sql+="INSERT INTO usage_video_tasks (usage_log_id, user_id, task_id) SELECT id, user_id, '${task_id}' FROM usage_logs WHERE model = 'MiniMax-H3' AND request_id = '${request_id}' ON CONFLICT (usage_log_id) DO NOTHING;"
          done
          sql+="SELECT COUNT(*) FROM usage_video_tasks vt JOIN usage_logs ul ON ul.id = vt.usage_log_id WHERE ul.model = 'MiniMax-H3';"
          sql_b64="$(printf '%s' "$sql" | base64 -w0)"

          result="$(printf '%s' "$sql_b64" | ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key "$SERVER_USER@$SERVER_HOST" \
            'base64 -d | docker exec -i ownapi-postgres sh -lc '\''psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -qAt'\''')"
          [ "$result" = "3" ] || { echo "H3 mapping verification failed" >&2; exit 1; }
          echo "Verified H3 mappings: 3"
