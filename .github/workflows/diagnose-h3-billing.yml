name: Diagnose H3 Reference Media

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Collect read-only H3 reference-media evidence
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i /tmp/ssh_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'sh -s' <<'REMOTE'
          set -eu
          cd /opt/ownapi/deploy

          echo "== Container state =="
          docker compose ps ownapi postgres redis
          docker inspect ownapi --format 'image={{.Config.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'

          echo "== Public frontend URL setting =="
          docker compose exec -T postgres psql -X -Atc "SELECT key || E'\\t' || value FROM settings WHERE key = 'frontend_url';"

          echo "== Video input storage =="
          if docker compose exec -T ownapi test -d /app/data/video-inputs; then
            echo "directory=present"
            docker compose exec -T ownapi find /app/data/video-inputs -maxdepth 1 -type f -printf '%m %s\\n' \
              | awk '{count += 1; bytes += $2; modes[$1] = 1} END {printf "files=%d bytes=%d modes=", count, bytes; for (mode in modes) printf "%s,", mode; print ""}'
          else
            echo "directory=missing"
          fi

          echo "== Recent sanitized H3 request evidence =="
          docker compose logs --since=4h --no-color ownapi 2>&1 \
            | sed -E 's#(/v1/video-inputs/)[^ ?"]+#\1[REDACTED]#g; s#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g; s#sk-[A-Za-z0-9._-]+#sk-[REDACTED]#g' \
            | grep -E 'MiniMax-H3|/v1/videos|/v1/video-inputs/|video\.' \
            | tail -n 120 \
            || true

          echo "== Public route and health checks =="
          curl -sS -o /dev/null -w 'health_status=%{http_code}\n' https://ownapi.dev/health
          curl -sS -o /dev/null -w 'invalid_input_status=%{http_code}\n' https://ownapi.dev/v1/video-inputs/not-a-valid-token
          REMOTE
